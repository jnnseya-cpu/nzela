name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify            # typecheck + 279 tests
      - run: pnpm build:blog        # regenerates blog; gate: every post ≥90 SEO & AEO
      - run: pnpm build:site        # assembles frontend/dist (deploy artifact)

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build both deploy images (no push) so the Dockerfiles stay green.
      - name: Build backend services image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
      - name: Build static site image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: false
