# Static serving for the assembled NZELA site. Mirrors the clean-route logic
# in the Netlify/Cloudflare (_redirects) and Apache (.htaccess) configs:
#   /pro           → /pro/index.html
#   /blog          → /blog/index.html
#   /blog/<slug>   → /blog/<slug>.html      (pretty article URLs)
#   unknown        → /404.html (404)
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # never cache HTML (content changes on redeploy); long-cache static assets
  location ~* \.(?:css|js|png|jpg|jpeg|svg|webp|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  # security headers (defense in depth for a static site)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /pro  { return 301 /pro/; }
  location = /blog { return 301 /blog/; }

  # pretty blog article URLs → the .html file
  location /blog/ {
    try_files $uri $uri/ $uri.html /blog/index.html;
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;
  location = /404.html { internal; }
}
